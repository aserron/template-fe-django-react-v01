[project]
name = "demo-fe-django-react"
version = "0.1.0"
description = "Full-stack Python/Django 6.1 backend + React 19 / React Native 0.88 (TypeScript 7 Go) workspace"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "django-ninja>=1.7.3",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "pyrefly>=1.4.1",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["backend", "."]
extend-exclude = [
    "**/migrations/*.py",
    "node_modules",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [
    "**/node_modules",
    "**/.venv",
    "**/migrations",
]
search-path = ["backend", "."]
python-version = "3.15"

[tool.pytest.ini_options]
testpaths = ["backend", "tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra -q"

